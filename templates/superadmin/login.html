{% extends "base.html" %}

{% block title %}SuperAdmin Login - {{ T.brand_title }}{% endblock %}

{% block content %}
<div class="w-full min-h-[calc(100vh-4.5rem)] flex flex-col justify-center px-4 sm:px-8 py-12 max-w-md mx-auto">

    <div class="bg-white rounded-3xl border border-neutral-200/90 shadow-sm p-8 space-y-6">
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-neutral-950 text-white flex items-center justify-center mx-auto shadow-xs">
                <i data-lucide="shield" class="w-5 h-5 text-emerald-400"></i>
            </div>
            <div class="text-[10px] font-bold uppercase tracking-widest text-neutral-400">Governance Console</div>
            <h1 class="text-2xl font-black tracking-tight text-neutral-950">SuperAdmin Login</h1>
            <p class="text-xs text-neutral-500">
                Restricted administrative access for Rojgar Setu platform management.
            </p>
        </div>

        <!-- Dedicated SuperAdmin Form -->
        <form method="POST" action="{% url 'superadmin_login' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-neutral-800 mb-1.5">
                    Admin Email
                </label>
                <input type="email" name="email" required autocomplete="email"
                       placeholder="superAdmin@gmail.com" class="form-input text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-neutral-800 mb-1.5">
                    Password
                </label>
                <input type="password" name="password" required autocomplete="current-password"
                       placeholder="Enter admin password" class="form-input text-sm">
            </div>

            <button type="submit" class="w-full bg-neutral-950 hover:bg-neutral-800 text-white font-bold py-3.5 rounded-full transition shadow-sm text-xs sm:text-sm mt-2 cursor-pointer">
                Access SuperAdmin Portal →
            </button>
        </form>
    </div>

</div>
{% endblock %}
